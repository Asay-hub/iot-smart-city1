<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакти - Smart City IoT</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="main-nav">
        <div class="nav-brand"><i class="fa-solid fa-satellite-dish"></i> IoT System</div>
        <ul class="nav-links">
            <li><a href="index.html">Головна (Дашборд)</a></li>
            <li><a href="services.html">Обладнання та Послуги</a></li>
            <li><a href="contacts.html" class="active">Контакти</a></li>
        </ul>
    </nav>

    <div class="page-container">
        <h1 style="color: var(--accent); border-bottom: 2px solid #333; padding-bottom: 10px;">Зв'яжіться з нами</h1>
        
        <div class="services-grid">
            <div class="stat-card">
                <h3 style="color: white; margin-top:0;">Контактна інформація</h3>
                <p style="color: #ccc;"><i class="fa-solid fa-user" style="color: var(--accent); width: 25px;"></i> Гуцол Олександра, група ТА-33</p>
                <p style="color: #ccc;"><i class="fa-solid fa-envelope" style="color: var(--accent); width: 25px;"></i> support@iot-smartcity.edu</p>
                <p style="color: #ccc;"><i class="fa-solid fa-phone" style="color: var(--accent); width: 25px;"></i> +38 (099) 123-45-67</p>
                <p style="color: #ccc;"><i class="fa-solid fa-location-dot" style="color: var(--accent); width: 25px;"></i> Кафедра автоматизації, ауд. 404</p>
            </div>

            <div class="stat-card">
                <h3 style="color: white; margin-top:0;">Форма зворотного зв'язку</h3>
                <form class="contact-form" action="#" method="get">
                    <input type="text" placeholder="Ваше ім'я" required>
                    <input type="email" placeholder="Ваш Email" required>
                    <textarea placeholder="Ваше повідомлення..." rows="4" required></textarea>
                    <button type="submit" class="btn-save" style="width: 100%; justify-content: center;">Надіслати повідомлення</button>
                </form>
            </div>
        </div>
    </div>

</body>
