<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Обладнання та Послуги - Smart City IoT</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="main-nav">
        <div class="nav-brand"><i class="fa-solid fa-satellite-dish"></i> IoT System</div>
        <ul class="nav-links">
            <li><a href="index.html">Головна (Дашборд)</a></li>
            <li><a href="services.html" class="active">Обладнання та Послуги</a></li>
            <li><a href="contacts.html">Контакти</a></li>
        </ul>
    </nav>

    <button class="floating-cart" onclick="toggleCartModal()">
        <i class="fa-solid fa-cart-shopping"></i>
        <span id="cart-count" class="cart-badge">0</span>
    </button>

    <div id="cartModal" class="modal-backdrop" onclick="if(event.target === this) toggleCartModal()">
        <div class="modal-content" style="max-width: 500px;">
            <span class="modal-close" onclick="toggleCartModal()">&times;</span>
            <h2 style="color: var(--accent); margin-top: 0;"><i class="fa-solid fa-cart-shopping"></i> Ваш кошик</h2>
            
            <div id="cart-items" class="cart-items-container">
                </div>
            
            <div class="cart-summary">
                <h3>Всього до сплати: <span id="cart-total" style="color: var(--success);">0 грн</span></h3>
                <button class="btn-save" style="width: 100%; justify-content: center; font-size: 1.1rem;" onclick="checkout()">
                    Оформити замовлення
                </button>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <div class="page-container">
        <h1 style="color: var(--accent); border-bottom: 2px solid #333; padding-bottom: 10px;">Наше обладнання та послуги</h1>
        <p style="color: #aaa; margin-bottom: 30px;">Перелік доступних IoT-модулів для розгортання в розумному місті. Оберіть потрібне та додайте до кошика.</p>

        <div id="products-container" class="services-grid"></div>
    </div>

    <script src="cart.js"></script>
</body>
</html>
